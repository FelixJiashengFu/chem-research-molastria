# MolAstria Pro 账号服务（deploy/account-worker.js）。步骤见 PAYMENTS.md 第 4 节。
#   cd deploy && npx wrangler deploy
name = "molastria-account"
main = "account-worker.js"
compatibility_date = "2026-10-01"

# 服务地址用 molastria.com 的子域名（DNS 托管在 Cloudflare；workers.dev 在中国大陆通常打不开）。
# 顶层设置必须写在下面的 [[d1_databases]] / [vars] 之前，否则会被归进那些段里。
routes = [{ pattern = "api.molastria.com", custom_domain = true }]
workers_dev = false

[triggers]
# 周一 12:00–20:00 UTC 每小时检查一次本周精选（生成过就跳过）；每 15 分钟发一小批邮件。改生成时间要同步改 account-worker.js 的 BUILD_CRON。
crons = ["0 12-20 * * 1", "*/15 * * * *"]

# 线上日志，在 Cloudflare 后台或 npx wrangler tail 查看。
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "molastria"
database_id = "2833d0b9-d3d6-45d9-8881-4384a6b41296"

# 讨论室（deploy/chat.js）：一个 Durable Object 类 ChatHub，全站只用一个实例（名字 hub），消息存在它自己的 SQLite 里。
# 免费套餐只能用 SQLite 存储的类，所以迁移里写 new_sqlite_classes。类建好以后改代码不用再加迁移；
# 改类名或删类才要在下面追加一段新的 [[migrations]]（tag 往后排，已有的不要改）。
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatHub"]

[vars]
ALLOWED_ORIGINS = "https://molastria.com,https://www.molastria.com,tauri://localhost,http://tauri.localhost,https://tauri.localhost"
MAIL_FROM = "MolAstria <login@molastria.com>"
MONTHLY_ASKS = "300"                               # 每个 Pro 席位每月的正式问答次数
FREE_DAILY_ASKS = "5"                              # 免费账号（邮箱登录、没付费）每 24 小时的托管问答次数；0 关掉
HOSTED_MODELS = "deepseek-flash"                   # 托管额度可用的模型（站长 2026-11-07 决定只留 Flash）；加 Muse 模型前先配置 MUSE_API_KEY
HOSTED_MODEL_WEIGHTS = "deepseek-v4-pro:3"         # 调用一次这个模型计几次；价格差很多的模型要写在这里
HOSTED_VISION_MODELS = "deepseek-flash"            # 托管额度里能看图的模型（带图片的请求只给这些）
UMA_ORIGIN = "https://uma-origin.molastria.com"   # 站长电脑上的在线 UMA（tools/uma-server，经 Cloudflare Tunnel）；暗号在 secret UMA_SERVER_SECRET
UMA_DAILY = "40"                                   # 匿名访客每天的在线模型次数（UMA、OMol25、ANI-2x 共用）
UMA_DAILY_ACCOUNT = "100"                          # 登录的免费账号每天的次数
UMA_DAILY_PRO = "200"                              # Pro 支持者每天的次数（UMA、OMol25 和 ANI-2x 共用）
ASL_DAILY = "40"                                   # MACE 系列（学术许可）每位访客每天的次数，账号和 Pro 都不加
API_DAILY_TOTAL = "2000"                           # 所有 API key 加起来每天最多用多少次，免得脚本把网站访客挤出队列；0 表示不设上限
SYNC_FREE_KB = "1024"                              # 云同步：免费账号的云端空间（KB）；0 表示只给 Pro 支持者
SYNC_PRO_KB = "10240"                              # 云同步：Pro 支持者的云端空间（KB）
WEB_DAILY_PRO = "50"                               # 联网网页搜索（Brave Search，只给 Pro）：每人每天的次数；要 secret BRAVE_SEARCH_KEY
WEB_MONTHLY_ALL = "1500"                           # 全站每 30 天最多搜多少次，给账单封顶（Brave 约每千次 5 美元）
API_COMPUTE = "1"                                  # 给程序用的计算接口 /v1（用账号页生成的 API key）；改成 "0" 再部署就关掉，网站自己的在线模型不受影响
V1_LINKS = ""                                     # 锁区 /vault/（一次性买断，/premium/v1）：它的 Stripe Payment Link 的 id（plink_…，可以逗号分隔写几个）；空着时按下面的金额认
V1_AMOUNT = "19900"                               # 没填 V1_LINKS 时：一次性付款正好是这个数（最小货币单位，19900 = ¥199.00）就算买了这个专区；"0" 关掉
V1_CURRENCY = "cny"
CHAT_STATE = "on"                                  # 讨论室：on 正常；readonly 只能看，只有站长能发言（自己的消息仍然可以删）；off 关掉（连接被拒绝，首页卡片不显示）
CHAT_ROOMS_PER_USER = "3"                          # 讨论室：每个账号最多同时开着几个自己的房间；0 表示不让用户开房间
CHAT_USER_ROOMS = "100"                            # 讨论室：全站用户房间的总数上限
CHAT_MAX_SOCKETS = "2000"                          # 讨论室：同时在线的连接数上限，满了新来的连不上（站长不受限）
CHAT_BLOCK = ""                                    # 讨论室：屏蔽词，逗号分隔，不分大小写，消息、昵称、房间名里出现就拒绝
CHAT_REPORT_MAIL = "1"                             # 讨论室：有举报没处理时给站长发邮件（每 12 小时最多一封）；改成 "0" 不发

# 密钥不要写在这里，用 npx wrangler secret put <名字> 逐个填入：
#   STRIPE_KEY        Stripe 受限密钥，只读：Customers、Checkout Sessions、Subscriptions
#   RESEND_API_KEY    Resend 发信密钥（molastria.com 需在 Resend 验证）
#   DEEPSEEK_API_KEY  托管额度使用的 DeepSeek key
