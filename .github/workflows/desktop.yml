name: Desktop builds

# Builds the Windows installer and the universal macOS disk image, then publishes them (plus the
# offline single-file edition) to a GitHub Release with fixed asset names, so the site's download
# buttons can point at releases/latest/download/<name>.
# The app version comes from the tag (desktop-v0.1.2 → 0.1.2). Update files are signed with the
# TAURI_SIGNING_PRIVATE_KEY secret and described in latest.json, which installed apps read to offer updates.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            asset: MolAstria-Windows-x64-setup.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            asset: MolAstria-macOS-universal.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (the updater signing key) before building."
            exit 1
          fi
          case "$GITHUB_REF_NAME" in desktop-v*) VERSION="${GITHUB_REF_NAME#desktop-v}";; *) VERSION="$(jq -r .version src-tauri/tauri.conf.json)";; esac
          echo "Building MolAstria $VERSION"
          npx tauri build ${{ matrix.args }} --config "{\"version\":\"$VERSION\"}"
      - name: Collect installer and update files
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            b=desktop/src-tauri/target/release/bundle
            cp $b/nsis/*-setup.exe "out/${{ matrix.asset }}"
            cp $b/nsis/*-setup.exe.sig "out/${{ matrix.asset }}.sig"
          else
            b=desktop/src-tauri/target/universal-apple-darwin/release/bundle
            cp $b/dmg/*.dmg "out/${{ matrix.asset }}"
            cp $b/macos/*.app.tar.gz out/MolAstria-macOS-universal.app.tar.gz
            cp $b/macos/*.app.tar.gz.sig out/MolAstria-macOS-universal.app.tar.gz.sig
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Update feed (latest.json)
        run: |
          case "$GITHUB_REF_NAME" in desktop-v*) TAG="$GITHUB_REF_NAME"; VERSION="${TAG#desktop-v}";; *) TAG=desktop-latest; VERSION="$(jq -r .version desktop/src-tauri/tauri.conf.json)";; esac
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          MAC_SIG="$(cat out/MolAstria-macOS-universal.app.tar.gz.sig)"
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "MolAstria $VERSION · https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            --arg wsig "$(cat out/MolAstria-Windows-x64-setup.exe.sig)" --arg wurl "$BASE/MolAstria-Windows-x64-setup.exe" \
            --arg msig "$MAC_SIG" --arg murl "$BASE/MolAstria-macOS-universal.app.tar.gz" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {signature: $wsig, url: $wurl},
               "darwin-aarch64": {signature: $msig, url: $murl},
               "darwin-x86_64": {signature: $msig, url: $murl}}}' > out/latest.json
          cat out/latest.json
      - name: Offline single-file edition and checksums
        run: |
          deno run --allow-read --allow-write tools/bundle-single.ts out/MolAstria-offline.html
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-latest' }}
          name: MolAstria Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          body: |
            MolAstria 桌面版 · Desktop app

            - Windows 10 / 11 (64-bit): `MolAstria-Windows-x64-setup.exe`
            - macOS 11+ (Apple silicon & Intel): `MolAstria-macOS-universal.dmg`
            - Offline single file (any browser): `MolAstria-offline.html`

            首次打开说明见 https://molastria.com/download/ · First-launch notes: https://molastria.com/download/?lang=en
          files: out/*
          make_latest: true
