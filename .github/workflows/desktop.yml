name: Desktop builds

# Builds the Windows installer and the universal macOS disk image, then publishes them (plus the
# offline single-file edition) to a GitHub Release with fixed asset names, so the site's download
# buttons can point at releases/latest/download/<name>.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            asset: MolAstria-Windows-x64-setup.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            asset: MolAstria-macOS-universal.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: desktop
        run: npx tauri build ${{ matrix.args }}
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp desktop/src-tauri/target/release/bundle/nsis/*.exe "out/${{ matrix.asset }}"
          else
            cp desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/${{ matrix.asset }}"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Offline single-file edition and checksums
        run: |
          deno run --allow-read --allow-write tools/bundle-single.ts out/MolAstria-offline.html
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-latest' }}
          name: MolAstria Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          body: |
            MolAstria 桌面版 · Desktop app

            - Windows 10 / 11 (64-bit): `MolAstria-Windows-x64-setup.exe`
            - macOS 11+ (Apple silicon & Intel): `MolAstria-macOS-universal.dmg`
            - Offline single file (any browser): `MolAstria-offline.html`

            首次打开说明见 https://molastria.com/download/ · First-launch notes: https://molastria.com/download/?lang=en
          files: out/*
          make_latest: true
