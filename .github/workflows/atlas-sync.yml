name: Research atlas sync

# Copies the newest build of 中美·研究图谱 into public/research-atlas/app/ whenever the atlas repository
# (university-science-research-network) has a new commit on main. The atlas repo's sync-molastria.yml starts this
# workflow right after each push to its main (when its secret MOLASTRIA_SYNC_TOKEN is set); as a fallback, every 30
# minutes it compares the atlas head with public/research-atlas/app/VERSION.txt and stops at once when they match
# (GitHub drops many scheduled runs, so the schedule alone can lag by hours). On a new commit it builds, copies, checks
# the copied pages in a browser and redeploys the site. This also picks up the atlas's monthly OpenAlex refresh (1st-4th).
# The desktop app frames the online copy, so desktop users see the new data without a new release.
# A push made with GITHUB_TOKEN does not start other workflows, so the site deploy is dispatched explicitly.
on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atlas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FelixJiashengFu/university-science-research-network
          path: atlas-src
      - name: Skip when the atlas has not changed
        id: check
        run: |
          head=$(git -C atlas-src rev-parse --short=7 HEAD)
          have=$(head -1 public/research-atlas/app/VERSION.txt | awk '{print $NF}')
          echo "atlas $head, copied $have"
          if [ "$head" = "$have" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.new == 'true'
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        if: steps.check.outputs.new == 'true'
        with:
          deno-version: v2.x
      - name: Build and copy the atlas
        if: steps.check.outputs.new == 'true'
        run: |
          (cd atlas-src && ./build_site.sh)
          node tools/vendor-atlas.mjs atlas-src
      - name: Check the atlas pages (theme, English, font)
        if: steps.check.outputs.new == 'true'
        run: |
          npm ci --prefix tools/e2e
          node tools/e2e/run.mjs "research atlas"
      - name: Commit and redeploy the site
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research-atlas/app
          if git diff --cached --quiet; then echo "Atlas unchanged"; exit 0; fi
          git commit -m "Research atlas sync ($(head -1 public/research-atlas/app/VERSION.txt | awk '{print $NF}'), $(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
