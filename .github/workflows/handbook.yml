# Reruns the PySCF calculations quoted in handbook chapters 12–16 (tools/handbook-calcs.py) and checks them against
# the numbers printed in the chapters (tools/handbook-test.mjs). About 5 minutes; only when the chapters or the script
# change, and by hand (the silicon band gap in chapter 13 takes another 20 minutes: run with "solid" ticked).
name: Handbook calculations

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/atlas/content.js'
      - 'public/atlas/guides-en.js'
      - 'tools/handbook-calcs.py'
      - 'tools/handbook-test.mjs'
  push:
    branches: [main]
    paths:
      - 'public/atlas/content.js'
      - 'public/atlas/guides-en.js'
      - 'tools/handbook-calcs.py'
      - 'tools/handbook-test.mjs'
  workflow_dispatch:
    inputs:
      solid:
        description: 'Also compute the silicon band gap (chapter 13, about 20 minutes)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  calcs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyscf==2.15.0
      - run: node --test tools/handbook-test.mjs
        env:
          HANDBOOK_SOLID: ${{ inputs.solid && '1' || '' }}
