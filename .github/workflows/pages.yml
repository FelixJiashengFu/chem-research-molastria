name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lab logic tests
        run: node --test tools/lab-test.mjs
      - name: Realms of Physics content
        run: node --test tools/realms-test.mjs
      - name: Network engine tests
        run: node --test tools/net-test.mjs
      - name: Web search logic tests
        run: node --test tools/websearch-test.mjs
      - name: Fundamental Science models and content
        run: node --test tools/fundamental-test.mjs
      - name: Math foundations · probability demos
        run: node --test tools/fm-prob-test.mjs
      - name: Formula questions (grader, parser, every answer checked numerically)
        run: node --test tools/formula-check-test.mjs
      - name: Quantum Biology models and content
        run: node --test tools/quantum-bio-test.mjs
      - name: Quantum Carnival · physics models and content
        run: node --test tools/quantum-physics-test.mjs
      - name: Quantum Algorithms models and content
        run: node --test tools/quantum-algorithms-test.mjs
      - name: Quantum Computers models and content
        run: node --test tools/quantum-computing-test.mjs
      - name: NMR models and content
        run: node --test tools/nmr-test.mjs
      - name: Home figures models
        run: node --test tools/home-figs-test.mjs
      - name: News explainers models and content
        run: node --test tools/news-test.mjs
      - name: U of T zone and company map content
        run: node --test tools/toronto-test.mjs
      - name: Chemistry Disciplines models and content
        run: node --test tools/chemistry-test.mjs
      - name: Spectra Hall models and content
        run: node --test tools/spectra-test.mjs
      - name: Frontier AI Maths models and content
        run: node --test tools/ai-math-test.mjs
      - name: Playground game physics
        run: node --test tools/play-test.mjs
      - name: 3D molecule viewer helpers
        run: node --test tools/mol3d-test.mjs
      - name: Review cards (decks, queue, Anki export)
        run: node --test tools/review-test.mjs
      - name: Cloud sync (three-way merge, devices against a fake account service)
        run: node --test tools/sync-test.mjs
      - name: Pets (adoption, time, actions, daily bond cap, levels, outfits)
        run: node --test tools/pet-test.mjs
      - name: Bookshelf (saved shelf, DOI / ISBN lookups, BibTeX, generated book list up to date)
        run: node --test tools/shelf-test.mjs
      # The two in-browser Python exercises are run here with the runner's Python + numpy and checked against PySCF and exact levels.
      - name: Python in the browser (runner helpers, H₂ Hartree–Fock, 1D Schrödinger solver)
        run: |
          python -m pip install numpy
          node --test tools/pyrun-test.mjs
      - name: Study Desk logic and site sources
        run: node --test tools/learn-test.mjs tools/learn-sources-test.mjs
      - name: AI assistant attachments (kinds, clipping, Word / Excel / PowerPoint)
        run: node --test tools/ai-files-test.mjs
      # openchemlib (in tools/e2e) is what the page loads from jsDelivr for SMILES → 3D; the NWChem / CP2K / Q-Chem readers use tools/code-fixtures.
      - name: Code desk (generated PySCF scripts run for real, real program outputs, SMILES → 3D)
        run: |
          python -m pip install pyscf
          npm ci --prefix tools/e2e
          node --test tools/code-test.mjs
      - name: Code desk cheminformatics (the generated RDKit script runs for real)
        run: |
          python -m pip install rdkit pandas
          node --test tools/cheminf-test.mjs
      - name: xTB and OpenMM backends of the online models (parsers, RMSD / RMSF helpers)
        run: python -m pip install numpy && python -X utf8 -m unittest tools/uma-server/test_xtb_backend.py tools/uma-server/test_openmm_backend.py -v
      # Content checks only (chapter counts match the catalogue, example numbers present in both languages);
      # handbook.yml reruns the PySCF calculations behind those numbers when the chapters or the script change.
      - name: Handbook chapters 12–16 (catalogue counts, example numbers, both languages)
        run: node --test tools/handbook-test.mjs
        env:
          HANDBOOK_SKIP_PYTHON: 1
      - name: Open Model Hall content (companies, items, task comparisons, pavilion pages)
        run: node --test tools/open-models-test.mjs
      # Every snippet the page marks as run is run again with whatever compilers the runner has; missing ones are skipped.
      - name: Programming languages zone (content, and the LJ snippets run for real)
        run: node --test tools/programming-test.mjs
      - name: Open data API content
        run: node --test tools/api-test.mjs
      - name: Python client (public/api/v1/molastria.py) against a stand-in service
        run: python3 tools/molastria-py-test.py
      - name: Rebuild the open data API (public/api/v1) from the data files
        run: node tools/build-api.mjs
      - name: Account service tests
        run: deno run --allow-read tools/account-test.ts
      # Deno and not Node for the first one: it needs node:sqlite, which the runner's own Node may be too old for (the test would skip itself).
      - name: Discussion rooms (the room logic on SQLite with stand-in sockets; the page's logic against the server's rules)
        run: |
          deno test --allow-read tools/chat-test.mjs
          node --test tools/chat-core-test.mjs
      - name: Rebuild SEO pages and sitemap
        run: deno run --allow-read --allow-write tools/build-seo.ts
      - name: Teaching-video covers (never fails the build; gone videos show as warnings)
        run: node tools/video-thumbs.mjs --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
