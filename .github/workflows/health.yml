# Browser checks with Stripe, mail and AI faked (tools/e2e/run.mjs), plus read-only checks of the live site
# (tools/e2e/live.mjs) on the weekly run. GitHub emails the repository owner when a run fails.
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable on the Actions page.
name: Health check

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --prefix tools/e2e
      - name: End-to-end checks
        run: node tools/e2e/run.mjs
      - name: Live site
        if: github.event_name != 'push'
        run: node tools/e2e/live.mjs
