[package]
name = "molastria"
version = "0.1.0"
description = "MolAstria — a computational chemistry atlas"
authors = ["MolAstria"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# No panic = "abort": wry wraps its WKURLSchemeTask calls (didFinish etc.) in objc2::exception::catch,
# which cannot catch an Objective-C exception under panic=abort. When WebKit stops a request before the
# app answers it, the exception then aborted the whole app on macOS (crash report from 0.1.19, docs/DECISIONS.md).
strip = true
