<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>og</title>
<style>
html,body{margin:0;width:1200px;height:630px;background:#0e100f;color:#f3f1ea;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden}
.wrap{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:84px 92px}
svg.sky{position:absolute;inset:0}
.mark{display:flex;align-items:center;gap:26px}
.word{font:400 104px/1 Georgia,"Times New Roman",serif;letter-spacing:1px}
.word i{letter-spacing:2px}
.sub{margin:30px 0 0;font-size:30px;letter-spacing:6px;color:#cfccc2}
.en{margin:10px 0 0;font:italic 24px Georgia,serif;color:#9d9a90;letter-spacing:1px}
.rule{width:120px;height:1px;background:#f3f1ea;opacity:.5;margin:42px 0 28px}
.tags{display:flex;gap:28px;font-size:22px;color:#e6e3da;letter-spacing:2px}
.tags span::before{content:"✦";margin-right:10px;color:#d6b06b;font-size:16px;vertical-align:3px}
</style></head><body><div class="wrap">
<svg class="sky" viewBox="0 0 1200 630" id="sky"></svg>
<div class="mark"><svg width="112" height="112" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#f3f1ea"/><g fill="none" stroke="#111311" stroke-linejoin="round"><ellipse cx="19" cy="21" rx="15" ry="5.6" transform="rotate(-28 19 21)" stroke-width=".75" opacity=".7"/><path d="M19 11.2 27.5 16.1v9.8L19 30.8l-8.5-4.9v-9.8Z" stroke-width="1.7"/><circle cx="19" cy="21" r="4.9" stroke-width="1"/></g><g fill="#111311"><circle cx="5.7" cy="26" r="1.3"/><path d="M30.6 5.2c.45 2.9 1.5 3.95 4.4 4.4-2.9.45-3.95 1.5-4.4 4.4-.45-2.9-1.5-3.95-4.4-4.4 2.9-.45 3.95-1.5 4.4-4.4Z"/><circle cx="35" cy="17.5" r=".7"/></g></svg><div class="word">Mol<i>Astria</i></div></div>
<p class="sub">计算化学研究导航</p>
<p class="en">A computational chemistry atlas — databases, methods and an AI lab</p>
<div class="rule"></div>
<div class="tags"><span>1,465 条资源</span><span>19 章中文讲解</span><span>闭环 AI 实验室</span><span>DeepSeek · Muse</span></div>
</div>
<script>
// Deterministic star field with a benzene-ring constellation on the right.
let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
let g = '';
for (let i = 0; i < 260; i++) g += `<circle cx="${(r() * 1200).toFixed(1)}" cy="${(r() * 630).toFixed(1)}" r="${(0.4 + r() * 1.3).toFixed(2)}" fill="#f3f1ea" opacity="${(0.15 + r() * 0.5).toFixed(2)}"/>`;
const cx = 1010, cy = 236, R = 104, pts = [...Array(6)].map((_, i) => [cx + R * Math.cos(Math.PI / 3 * i - Math.PI / 2), cy + R * Math.sin(Math.PI / 3 * i - Math.PI / 2)]);
g += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p.join(',')).join('')}Z" fill="none" stroke="#d6b06b" stroke-opacity=".55" stroke-width="1.3"/>`;
g += `<circle cx="${cx}" cy="${cy}" r="64" fill="none" stroke="#d6b06b" stroke-opacity=".35" stroke-width="1"/>`;
g += `<ellipse cx="${cx}" cy="${cy}" rx="230" ry="80" transform="rotate(-28 ${cx} ${cy})" fill="none" stroke="#f3f1ea" stroke-opacity=".18" stroke-width="1"/>`;
g += pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="#f3f1ea"/>`).join('');
document.getElementById('sky').innerHTML = g;
</script></body></html>
