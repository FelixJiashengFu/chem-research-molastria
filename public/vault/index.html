<!-- 锁区：这一页在公开仓库里只有一把锁和通用的阅读器。正文、目录、公式、文献和演示的代码都不在仓库里，买了以后才由账号服务 /premium/v1 发给浏览器。

          <radialGradient id="vg-glow"><stop class="vg-hi" offset="0" stop-opacity=".95"/><stop class="vg-mid" offset=".45" stop-opacity=".4"/><stop class="vg-mid" offset="1" stop-opacity="0"/></radialGradient>
          <clipPath id="vg-clip"><rect x="14" y="66" width="92" height="74" rx="14"/></clipPath>
        </defs>
        <ellipse class="vlt-shadow" cx="60" cy="146" rx="38" ry="4"/>

          <circle class="vlt-plate" cx="60" cy="103" r="22" fill="none" stroke-width="1.4"/>
          <g class="vlt-key"><circle class="vlt-hole" cx="60" cy="98" r="8"/><path class="vlt-hole" d="M56 101h8l2.6 17H53.4Z"/></g>
        </g>
        <circle class="vlt-glow" cx="60" cy="103" r="46" fill="url(#vg-glow)"/>
      </svg>
    </div>
