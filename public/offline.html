<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#173f34">
  <title>MolAstria · 离线</title>
  <!-- sw.js shows this page in place of a page that was never opened, when there is no network. It is served under
       that page's address, so it loads nothing else: styles, mark and both languages are inline. -->
  <style>
    :root{color-scheme:light;--paper:#f6f5ee;--surface:#fdfcf8;--ink:#1c3a2f;--muted:#5f6f63;--line:#d8dfd2;--accent:#204f3d}
    :root[data-theme=dark]{color-scheme:dark;--paper:#101613;--surface:#161e1a;--ink:#e3e9df;--muted:#9aa99e;--line:#2a3731;--accent:#3f7d60}
    @media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--paper:#101613;--surface:#161e1a;--ink:#e3e9df;--muted:#9aa99e;--line:#2a3731;--accent:#3f7d60}}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
    body{display:grid;place-items:center;min-height:100vh;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));box-sizing:border-box;font:15px/1.7 Inter,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    main{max-width:420px;padding:28px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center}
    svg{width:56px;height:56px}
    h1{font-size:20px;margin:14px 0 6px}
    p{margin:0 0 18px;color:var(--muted)}
    .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    button,a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;line-height:1;text-decoration:none;cursor:pointer}
    button{background:var(--accent);border-color:var(--accent);color:#fff}
    [lang=en] .zh,[lang=zh-CN] .en{display:none}
  </style>
  <script>try{var d=document.documentElement,s=localStorage,t=s.getItem("chemhub-theme");if(t==="dark"||t==="light")d.dataset.theme=t;if(s.getItem("chemhub-lang")==="en"||/[?&]lang=en/.test(location.search))d.lang="en"}catch(e){}</script>
</head>
<body>
<main>
  <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#111311"/><g fill="none" stroke="#f3f1ea" stroke-linejoin="round"><ellipse cx="19" cy="21" rx="15" ry="5.6" transform="rotate(-28 19 21)" stroke-width=".75" opacity=".7"/><path d="M19 11.2 27.5 16.1v9.8L19 30.8l-8.5-4.9v-9.8Z" stroke-width="1.7"/><circle cx="19" cy="21" r="4.9" stroke-width="1"/></g><g fill="#f3f1ea"><circle cx="5.7" cy="26" r="1.3"/><path d="M30.6 5.2c.45 2.9 1.5 3.95 4.4 4.4-2.9.45-3.95 1.5-4.4 4.4-.45-2.9-1.5-3.95-4.4-4.4 2.9-.45 3.95-1.5 4.4-4.4Z"/><circle cx="35" cy="17.5" r=".7"/></g></svg>
  <h1><span class="zh">现在没有网络</span><span class="en" lang="en">You are offline</span></h1>
  <p><span class="zh">这个页面还没有在这台设备上打开过，联网后才能看。打开过的页面断网也能读。</span><span class="en" lang="en">This page has not been opened on this device yet, so it needs the network. Pages you have opened before can be read offline.</span></p>
  <div class="row">
    <button type="button" onclick="location.reload()"><span class="zh">重试</span><span class="en" lang="en">Try again</span></button>
    <a href="/"><span class="zh">回到首页</span><span class="en" lang="en">Home</span></a>
  </div>
</main>
</body>
</html>
