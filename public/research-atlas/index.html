<script>
  (function () {
    var frame = document.getElementById('atlas-frame'), root = document.documentElement;
    // The atlas page being shown is mirrored in this page's address (#/top20/#A5…), so a reload (switching the
    // language) or a shared link opens the same page. Only paths inside app/ are accepted.
    function target() {
      var m = /^#\/([\w\-\/]*(?:index\.html)?)(#[\w\-=&%.]*)?$/.exec(location.hash);
      return m && !/\.\./.test(m[1]) ? m[1] + (m[2] || '') : '';
    }
    var start = target();
    // The desktop app leaves the atlas out of its bundle (about 100 MB of network data) and shows the website's copy.
    var desktop = window.__MOLASTRIA_DESKTOP__;
    var app = desktop ? 'https://molastria.com/research-atlas/app/' : 'app/';
    // The atlas follows this page's language, light/dark and typeface: the first address carries them (the atlas keeps
    // them for links inside the frame) and changes are posted to it, which also works across origins in the desktop app.
    function host() { return { type: 'ra-host', lang: root.lang === 'en' ? 'en' : '', theme: root.dataset.theme || '', font: root.dataset.font || '' }; }
    function src(path) {
      var h = host(), i = path.indexOf('#'), q = 'embed=1&lang=' + h.lang + '&theme=' + h.theme + '&font=' + h.font;
      return app + (i < 0 ? path + '?' + q : path.slice(0, i) + '?' + q + path.slice(i));
    }
    function post() { try { frame.contentWindow.postMessage(host(), '*'); } catch (e) {} }
    new MutationObserver(post).observe(root, { attributes: true, attributeFilter: ['data-theme', 'data-font', 'lang'] });
    frame.src = src(start);
    var appPath = new URL(app, location.href).pathname;
    function mirror() {
      try {
        var w = frame.contentWindow, p = w.location.pathname;
        if (p.indexOf(appPath) !== 0) return;
        var rest = p.slice(appPath.length).replace(/index\.html$/, '') + w.location.hash;
        var next = rest ? '#/' + rest : '';
        if (next !== location.hash && !(next === '' && !location.hash)) history.replaceState(history.state, '', location.pathname + location.search + next);
        var t = w.document.title; if (t) document.title = t + ' · 研究图谱 · MolAstria';
      } catch (e) {}

    frame.addEventListener('load', function () {
      post(); mirror();
      try { frame.contentWindow.addEventListener('hashchange', mirror); } catch (e) {}
    });

    // A changed address (a link to another atlas page, typing a new #/…) loads that page in the frame.
    addEventListener('hashchange', function () { frame.src = src(target()); });
    // Links to other sites (OpenAlex, DOIs, ORCID, the GitHub repository) open outside the frame: a new tab on the
    // website, the system browser in the desktop app.
    frame.addEventListener('load', function () {
      var w; try { w = frame.contentWindow; w.document; } catch (e) { return; }
      var ipc = window.__TAURI_INTERNALS__;

        try { var u = new URL(href, w.location.href); return /^https?:$/.test(u.protocol) && u.origin !== w.location.origin ? u.href : null; } catch (e) { return null; }
      }
      w.document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null, url = a && outside(a.getAttribute('href'));

        e.preventDefault();
        if (desktop && ipc && !w.__MOLASTRIA_DESKTOP__) ipc.invoke('plugin:opener|open_url', { url: url });

    });
  })();
